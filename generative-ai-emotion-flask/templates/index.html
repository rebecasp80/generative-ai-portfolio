<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Emotion AI — Modern UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #fff;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            padding: 30px;
            background: rgba(255,255,255,0.06);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            opacity: 0.8;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border-radius: 12px;
            border: none;
            outline: none;
            font-size: 1rem;
            margin-top: 20px;
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        select {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 12px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border-radius: 12px;
            border: none;
            background: #6c63ff;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #7b73ff;
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.08);
            border-radius: 15px;
        }

        .emotion-dominant {
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .bar {
            height: 12px;
            background: #6c63ff;
            border-radius: 10px;
            transition: width 0.5s;
        }

        .bar-container {
            margin-bottom: 15px;
        }

        .label {
            margin-bottom: 5px;
            font-size: 0.9rem;
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Emotion AI</h1>
        <p>Detecta emociones con modelos BERT, LoRA, QLoRA y Adapters</p>

        <textarea id="textInput" placeholder="Escribe tu texto aquí..."></textarea>

        <select id="modelSelect">
            <option value="base">Modelo Base</option>
            <option value="lora">LoRA</option>
            <option value="qlora">QLoRA</option>
            <option value="adapter">Adapter</option>
        </select>

        <button onclick="analyzeEmotion()">Analizar Emoción</button>

        <div id="result" class="result-box" style="display:none;"></div>
    </div>

    <script>
        async function analyzeEmotion() {
            const text = document.getElementById("textInput").value;
            const model = document.getElementById("modelSelect").value;

            const response = await fetch(`/emotionDetector?textToAnalyze=${encodeURIComponent(text)}&model=${model}`);
            const data = await response.json();

            const resultBox = document.getElementById("result");
            resultBox.style.display = "block";

            let html = `
                <div class="emotion-dominant">Emoción dominante: <strong>${data.emotion}</strong></div>
            `;

            const emotions = ["anger", "fear", "joy", "love", "sadness", "surprise"];
            const probs = data.probabilities[0];

            emotions.forEach((emotion, i) => {
                html += `
                    <div class="bar-container">
                        <div class="label">${emotion}: ${(probs[i] * 100).toFixed(2)}%</div>
                        <div class="bar" style="width:${probs[i] * 100}%"></div>
                    </div>
                `;
            });

            resultBox.innerHTML = html;
        }
    </script>
</body>
</html>
